<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login • Alzheimer’s App</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      margin: 0;
      background: #0e1117;
      color: #fff;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .wrap {
      width: 100%;
      max-width: 400px;
      background: #1e222a;
      border-radius: 14px;
      border: 1px solid #2d2f36;
      padding: 26px 24px 30px;
      box-sizing: border-box;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.6rem;
    }
    .subtitle {
      margin-bottom: 18px;
      color: #9ca3af;
      font-size: 0.9rem;
    }
    label {
      display: block;
      font-size: 0.86rem;
      color: #c9d1d9;
      margin: 10px 0 6px;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 9px;
      border: 1px solid #3a3f4b;
      background: #111827;
      color: #f9fafb;
      outline: none;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    input:focus {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.7);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 0.8rem;
      color: #9ca3af;
    }
    .row a {
      color: #60a5fa;
      text-decoration: none;
    }
    .row a:hover {
      text-decoration: underline;
    }
    .btn-primary {
      width: 100%;
      margin-top: 20px;
      padding: 11px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #1e88e5, #2563eb);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-primary:hover {
      filter: brightness(1.08);
    }
    .bottom-text {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #9ca3af;
      text-align: center;
    }
    .bottom-text a {
      color: #60a5fa;
      text-decoration: none;
    }
    .bottom-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Welcome back</h1>
    <p class="subtitle">Login to access your Alzheimer’s dashboard.</p>

    <!-- Adjust action="/login" to match your FastAPI route -->
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />

      <div class="row">
        <label style="display:flex;align-items:center;gap:6px;">
          <input type="checkbox" name="remember" style="width:auto;margin:0;" />
          <span>Remember me</span>
        </label>
        <a href="/forgot-password">Forgot password?</a>
      </div>

      <button class="btn-primary" type="submit">Login</button>
    </form>

    <p class="bottom-text">
      Don’t have an account?
      <a href="/register">Create one</a>
    </p>
  </div>
</body>
</html>
