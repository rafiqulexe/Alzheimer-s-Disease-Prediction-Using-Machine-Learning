<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Register • Alzheimer’s App</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      margin: 0;
      background: #0e1117;
      color: #fff;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .wrap {
      width: 100%;
      max-width: 450px;
      background: #1e222a;
      border-radius: 14px;
      border: 1px solid #2d2f36;
      padding: 28px 26px 30px;
      box-sizing: border-box;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.6rem;
    }
    .subtitle {
      margin-bottom: 20px;
      color: #9ca3af;
      font-size: 0.9rem;
    }
    label {
      display: block;
      font-size: 0.86rem;
      color: #c9d1d9;
      margin: 10px 0 6px;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 9px;
      border: 1px solid #3a3f4b;
      background: #111827;
      color: #f9fafb;
      outline: none;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    input:focus {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.7);
    }
    .two-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-primary {
      width: 100%;
      margin-top: 20px;
      padding: 11px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #1e88e5, #2563eb);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-primary:hover {
      filter: brightness(1.08);
    }
    .bottom-text {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #9ca3af;
      text-align: center;
    }
    .bottom-text a {
      color: #60a5fa;
      text-decoration: none;
    }
    .bottom-text a:hover {
      text-decoration: underline;
    }
    .error {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #fca5a5;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Create an account</h1>
    <p class="subtitle">Sign up to access the Alzheimer’s prediction dashboard.</p>

    <!-- Adjust action="/register" to match your FastAPI route -->
    <form method="post" action="/register" onsubmit="return checkPasswords(event)">
      <label for="full_name">Full name</label>
      <input id="full_name" name="full_name" type="text" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />

      <div class="two-cols">
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required maxlength="72" />
        </div>
        <div>
          <label for="confirm_password">Confirm</label>
          <input id="confirm_password" name="confirm_password" type="password" required maxlength="72" />
        </div>
      </div>

      <label for="age">Age</label>
      <input id="age" name="age" type="number" min="0" max="120" />

      <label for="phone">Phone (optional)</label>
      <input id="phone" name="phone" type="tel" />

      <button class="btn-primary" type="submit">Create account</button>
      <div id="error" class="error"></div>
    </form>

    <p class="bottom-text">
      Already have an account?
      <a href="/login">Log in</a>
    </p>
  </div>

  <script>
    function checkPasswords(e) {
      const p1 = document.getElementById("password").value;
      const p2 = document.getElementById("confirm_password").value;
      const err = document.getElementById("error");
      if (p1 !== p2) {
        e.preventDefault();
        err.textContent = "Passwords do not match.";
        return false;
      }
      err.textContent = "";
      return true;
    }
  </script>
</body>
</html>
