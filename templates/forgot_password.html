<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Forgot password • Alzheimer’s App</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{margin:0;background:#0e1117;color:#fff;font-family:"Poppins",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .wrap{width:100%;max-width:420px;background:#1e222a;border-radius:14px;border:1px solid #2d2f36;padding:26px 24px 30px;box-shadow:0 16px 40px rgba(0,0,0,.45)}
    h1{margin:0 0 4px;font-size:1.6rem}
    .subtitle{margin-bottom:18px;color:#9ca3af;font-size:.9rem}
    label{display:block;font-size:.86rem;color:#c9d1d9;margin:10px 0 6px}
    input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #3a3f4b;background:#111827;color:#f9fafb;outline:none;font-size:.95rem;box-sizing:border-box}
    input:focus{border-color:#1d4ed8;box-shadow:0 0 0 1px rgba(37,99,235,.7)}
    .btn{width:100%;margin-top:16px;padding:11px;border-radius:999px;border:none;background:linear-gradient(135deg,#1e88e5,#2563eb);color:#fff;font-weight:700;cursor:pointer;font-size:.95rem}
    .btn:hover{filter:brightness(1.08)}
    .bottom{margin-top:14px;font-size:.85rem;color:#9ca3af;text-align:center}
    .bottom a{color:#60a5fa;text-decoration:none}
    .bottom a:hover{text-decoration:underline}
    .note{margin-top:10px;font-size:.82rem;color:#9ca3af}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Reset your password</h1>
    <p class="subtitle">Enter your email and we’ll send a reset link (connect backend later).</p>

    <form method="post" action="/forgot-password">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />
      <button class="btn" type="submit">Send reset link</button>
      <p class="note">If you don’t receive an email, check spam or contact support.</p>
    </form>

    <p class="bottom"><a href="/login">Back to login</a></p>
  </div>
</body>
</html>
