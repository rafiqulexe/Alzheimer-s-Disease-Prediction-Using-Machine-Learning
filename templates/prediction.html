<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Prediction • Alzheimer’s App</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    .card{max-width:1100px;margin:0 auto}
    .section{border:1px solid var(--border);border-radius:12px;padding:16px;background:#fff}
    .section + .section{margin-top:14px}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .section-head h2{margin:0;font-size:1.05rem}
    .section-head span{font-size:.8rem;color:var(--muted)}
    .muted-input{width:100%;padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px dashed #94a3b8;color:#94a3b8;font-size:.9rem}
    .button-row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
    .result{margin-top:10px;font-weight:700;min-height:22px}
    .result.ok{color:var(--accent-dark)}
    .result.err{color:#b91c1c}
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-logo">A</div>
      <a href="/dashboard" class="side-icon" title="Dashboard">🏠</a>
      <a href="/patients" class="side-icon" title="Patients">👤</a>
      <a href="/reports" class="side-icon" title="Reports">📊</a>
      <a href="/settings" class="side-icon" title="Settings">⚙️</a>
      <div class="sidebar-footer">v1.0</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">Alzheimer’s Disease Detection</div>
        <div class="topbar-right">
          <div class="user-pill">
            {{ full_name or user_email or "User" }}
            <a class="logout-link" href="/logout">Logout</a>
          </div>
        </div>
      </header>

      <main class="content">
        <div class="page-header">
          <h1>Prediction form</h1>
          <p class="page-subtitle">Enter the patient’s details and clinical information to run the model.</p>
        </div>

        <section class="card">
          <form id="prediction-form">
            <div class="section">
              <div class="section-head">
                <h2>👤 Patient information</h2>
                <span>Required before prediction</span>
              </div>

              <div class="form-grid">
                <div>
                  <label class="muted" for="patient_name">Full name</label>
                  <input id="patient_name" class="input" name="patient_name" type="text" required />
                </div>
                <div>
                  <label class="muted" for="birthdate">Date of birth</label>
                  <input id="birthdate" class="input" name="birthdate" type="date" required />
                </div>
                <div>
                  <label class="muted" for="gender">Gender</label>
                  <select id="gender" name="gender" required>
                    <option value="">Select…</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other / Prefer not to say</option>
                  </select>
                </div>
                <div>
                  <label class="muted" for="phone">Contact number</label>
                  <input id="phone" class="input" name="phone" type="text" placeholder="+8801XXXXXXXXX" required />
                </div>

                <div class="full-span">
                  <label class="muted">Patient ID</label>
                  <input class="muted-input" value="Will be generated automatically after prediction" disabled />
                </div>

                <div class="full-span" style="display:flex;justify-content:flex-end">
                  <button type="button" class="btn btn-ghost" onclick="addPatientManual()">+ Add patient (no prediction)</button>
                </div>
              </div>
            </div>

            <div class="section">
              <div class="section-head">
                <h2>🧠 Input features</h2>
                <span>Model: Random Forest</span>
              </div>

              <div class="form-grid">
                <div>
                  <label class="muted" for="memory">Memory complaints</label>
                  <select id="memory" name="memory_complaints" required>
                    <option value="">Select…</option>
                    <option value="0">No (0)</option>
                    <option value="1">Yes (1)</option>
                  </select>
                </div>
                <div>
                  <label class="muted" for="behavior">Behavioral problems</label>
                  <select id="behavior" name="behavioral_problems" required>
                    <option value="">Select…</option>
                    <option value="0">No (0)</option>
                    <option value="1">Yes (1)</option>
                  </select>
                </div>
                <div>
                  <label class="muted" for="adl">ADL score (0–10)</label>
                  <input id="adl" class="input" name="adl" type="number" min="0" max="10" step="0.01" placeholder="e.g. 5.50" required />
                </div>
                <div>
                  <label class="muted" for="mmse">MMSE score (0–30)</label>
                  <input id="mmse" class="input" name="mmse" type="number" min="0" max="30" step="0.1" placeholder="e.g. 24" required />
                </div>
                <div class="full-span">
                  <label class="muted" for="functional">Functional assessment score (0–10)</label>
                  <input id="functional" class="input" name="functional_assessment" type="number" min="0" max="10" step="0.01" placeholder="e.g. 7.20" required />
                </div>
              </div>

              <div id="result" class="result"></div>

              <div class="button-row">
                <button class="btn btn-primary" type="submit">Run prediction</button>
                <button type="button" class="btn btn-ghost" onclick="clearFormFields()">Clear</button>
              </div>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>

<script>
const form = document.getElementById("prediction-form");
const resultEl = document.getElementById("result");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = new URLSearchParams(new FormData(form));
  resultEl.className = "result";
  resultEl.textContent = "⏳ Running prediction...";

  try {
    const resp = await fetch("/predict", { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body });
    const data = await resp.json();
    resultEl.classList.add("ok");
    resultEl.textContent = `🧩 Prediction: ${data.label} (ID: ${data.patient_id})`;
  } catch (err) {
    console.error(err);
    resultEl.classList.add("err");
    resultEl.textContent = "❌ Error while running prediction.";
  }
});

async function addPatientManual() {
  const name = document.getElementById("patient_name").value.trim();
  const birthdate = document.getElementById("birthdate").value;
  const gender = document.getElementById("gender").value;
  const phone = document.getElementById("phone").value.trim();

  if (!name || !birthdate || !gender || !phone) {
    alert("Please fill in name, birthdate, gender and contact number first.");
    return;
  }

  const body = new URLSearchParams({ patient_name:name, birthdate, gender, phone });

  try {
    const resp = await fetch("/patients/manual", { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body });
    const data = await resp.json();
    if (data.ok) window.location.href = "/patients";
    else alert("Unable to add patient.");
  } catch (err) {
    console.error(err);
    alert("Server error — patient not added.");
  }
}

function clearFormFields() {
  form.reset();
  resultEl.className = "result";
  resultEl.textContent = "";
}
</script>
</body>
</html>
